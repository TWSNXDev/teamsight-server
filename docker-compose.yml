services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - internal
      - proxy

  # One-off job: `docker compose run --rm migrate` applies pending Prisma
  # migrations. Built from the `build` stage (not `runner`) because that's
  # the only stage with the Prisma CLI in it — the production image
  # deliberately doesn't ship devDependencies.
  migrate:
    build:
      context: .
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    entrypoint: []
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    profiles: ["tools"]

networks:
  internal:
  proxy:
    external: true

volumes:
  postgres_data:
